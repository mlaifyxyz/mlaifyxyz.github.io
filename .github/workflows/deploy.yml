# Builds matthewd.xyz on every PR, and deploys it to Cloudflare (Workers static
# assets) after the operator approves.
#
# A push to main starts the deploy job in the `production` environment, which waits
# for its required reviewer; once approved it builds and runs `wrangler deploy`.
# This job is the only thing that changes the live site. See README.md "Deploy".
name: deploy

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
    cancel-in-progress: false

env:
    HUGO_VERSION: 0.162.1
    WRANGLER_VERSION: 4.156.0

jobs:
    build:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Hugo
              run: |
                  base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
                  tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  cd "$RUNNER_TEMP"
                  curl -fsSLO "$base/$tarball"
                  curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
                  grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
                  mkdir hugo && tar -xzf "$tarball" -C hugo hugo
                  echo "$RUNNER_TEMP/hugo" >>"$GITHUB_PATH"

            - name: Build
              run: npm run build:cf

    deploy:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-24.04
        environment:
            name: production
            url: https://matthewd.xyz/
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Hugo
              run: |
                  base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
                  tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  cd "$RUNNER_TEMP"
                  curl -fsSLO "$base/$tarball"
                  curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
                  grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
                  mkdir hugo && tar -xzf "$tarball" -C hugo hugo
                  echo "$RUNNER_TEMP/hugo" >>"$GITHUB_PATH"

            - name: Build
              run: npm run build:cf

            - name: Deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy
