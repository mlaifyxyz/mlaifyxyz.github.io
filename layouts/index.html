{{ define "main" }}
<section class="container-column pt-16 pb-6 sm:pt-20">
  <img src="{{ "/images/pic-mdavis-home.svg" | relURL }}"
       alt="Matt D."
       width="72" height="72"
       class="h-[72px] w-[72px] rounded-full object-cover ring-1 ring-copper-200 dark:ring-copper-800" />
  <p class="kicker mt-8">matthewd.xyz</p>
  <h1 class="page-title mt-3">Matt D.</h1>
  <p class="page-lead">{{ site.Params.intro | default site.Params.tagline }}</p>
  <p class="mt-6 flex flex-wrap gap-x-5 gap-y-2 text-sm">
    <a class="text-link" href="/about/">About me</a>
    <a class="text-link" href="/writing/">All writing</a>
    <a class="text-link" href="https://mlaify.io/">Projects at mlaify.io ↗</a>
  </p>
</section>

<div class="container-column"><div class="ornament" aria-hidden="true">❦</div></div>

<section class="container-column" aria-labelledby="writing-heading">
  <h2 id="writing-heading" class="kicker">Writing</h2>
  <div class="mt-6">
    {{ partial "post-index.html" (first 10 (where site.RegularPages "Section" "writing")) }}
  </div>
  <p class="mt-8 text-sm"><a class="text-link" href="/writing/">Every post →</a></p>
</section>
{{ end }}
