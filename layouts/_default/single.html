{{ define "main" }}
<article class="container-column py-14 sm:py-16">
  <header>
    {{- with .Params.kicker }}<p class="kicker">{{ . }}</p>{{ end }}
    <h1 class="page-title{{ with .Params.kicker }} mt-3{{ end }}">{{ .Title }}</h1>
    {{- with .Params.lead | default .Description }}
      <p class="page-lead">{{ . }}</p>
    {{- end }}
    {{- with .Params.lastmod }}
      <p class="mt-4 text-xs uppercase tracking-wider text-ink-500 dark:text-ink-400">Last updated {{ time.Format "January 2, 2006" . }}</p>
    {{- end }}
  </header>

  <div class="prose-writing mt-10">
    {{ .Content }}
  </div>
</article>
{{ end }}
