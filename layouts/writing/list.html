{{ define "main" }}
<section class="container-column py-14 sm:py-16">
  <header>
    <p class="kicker">Archive</p>
    <h1 class="page-title mt-3">{{ .Title }}</h1>
    {{- with .Description }}
      <p class="page-lead">{{ . }}</p>
    {{- end }}
  </header>

  {{- if .Content }}
    <div class="prose-writing mt-8">{{ .Content }}</div>
  {{- end }}

  <div class="ornament" aria-hidden="true">❦</div>

  {{ partial "post-index.html" (where .Pages "Section" "writing") }}
</section>
{{ end }}
